url: https://adrientaudiere.github.io/ggplotpq/
template:
  bootstrap: 5
  bslib:
    bg: "#dccfe1"
    fg: "#16091f"
    primary: "#0072B2"
    secondary: "#a3345a"

reference:
  - title: "Migration from MiscMetabar"
    desc: "Functions migrated from MiscMetabar that operate on a single phyloseq object."
    contents:
      - wheat_plot
      - reorder_distinct_colors
      - plot_tax_count_pq
  - title: "Migration from comparpq"
    desc: "Functions migrated from comparpq (single-phyloseq variant)."
    contents:
      - gg_bubbles_pq
  - title: "Migration from taxinfo"
    desc: "Theme and palette helpers migrated from taxinfo."
    contents:
      - theme_idest
      - idest_pal
      - idest_colors
      - scale_color_idest_c
      - scale_fill_idest_c
      - scale_color_idest_d
      - scale_fill_idest_d
  - title: "New visualisation functions"
    desc: "Pure-ggplot2 helpers for phyloseq objects (geoms, themes, scales, palettes)."
    contents:
      - comet_pq
      - community_sharing_plot
      - community_sharing_barplot
      - make_sharing_metric
      - default_sharing_metrics
      - palette_earthtones
      - plot_sample_depth_pq
      - plot_taxa_heatmap_pq
      - scale_color_pq_discrete
      - scale_fill_pq_discrete
      - ternary_biomarker_pq
      - ternary_pq
      - theme_pq_minimal
  - title: "New single-phyloseq analysis wrappers"
    desc: "Analysis wrappers that ship a ggplot (the analysis lives here, the plot is the deliverable)."

navbar:
  structure:
    left:
      - home
      - intro
      - reference
      - articles
      - news
    right:
      - github
